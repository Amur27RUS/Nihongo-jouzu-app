<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<style>
/* base reset: the page keeps clear of the phone's notch and home bar */
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Nihongo jouzu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: one-column phone app. Home = streak + today's review + topics; Dictionary = searchable word list; Lesson = top bar / task / sticky answer sheet. */
:root {
  --bg: #f7f4ee;
  --card: #ffffff;
  --ink: #1d2238;
  --muted: #6b6f85;
  --line: #e3ded3;
  --accent: #4655d4;
  --accent-ink: #ffffff;
  --accent-edge: #2f3cad;
  --gold: #e9a23b;
  --fire: #f07a35;
  --good: #2e9e64;
  --good-bg: #dcf3e5;
  --good-edge: #1f7a4a;
  --bad: #d9434a;
  --bad-bg: #fbe1e2;
  --bad-edge: #a92d33;
  --sel-bg: #e7e9fb;
  --learn: #a9b1ee;
  --xp-bar: #c9821a;
  --font-ui: "Nunito", "M PLUS Rounded 1c", system-ui, sans-serif;
  --font-jp: "M PLUS Rounded 1c", "Noto Sans JP", "Hiragino Maru Gothic ProN", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14172a; --card: #1e2238; --ink: #eef0f8; --muted: #9da2bd; --line: #30365a;
  --accent: #7d89f0; --accent-ink: #10132a; --accent-edge: #5662c9; --gold: #f0b65c; --fire: #f59a5e;
  --good: #5fcf8f; --good-bg: #173a2a; --good-edge: #3e9e68; --bad: #f07a80; --bad-bg: #42202a; --bad-edge: #b4525b; --sel-bg: #2a3060; --learn: #4a55a8; --xp-bar: #b88530;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #14172a; --card: #1e2238; --ink: #eef0f8; --muted: #9da2bd; --line: #30365a;
  --accent: #7d89f0; --accent-ink: #10132a; --accent-edge: #5662c9; --gold: #f0b65c; --fire: #f59a5e;
  --good: #5fcf8f; --good-bg: #173a2a; --good-edge: #3e9e68; --bad: #f07a80; --bad-bg: #42202a; --bad-edge: #b4525b; --sel-bg: #2a3060; --learn: #4a55a8; --xp-bar: #b88530;
  color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; font-weight: 500; -webkit-tap-highlight-color: transparent; overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.jp { font-family: var(--font-jp); }
#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* the raised edge is a shadow, not a thicker border: it takes no space, so pressing a button never moves anything around it */
.btn { --edge: var(--line); --lift: 3px; border: 2px solid var(--line); border-radius: 16px; background: var(--card); padding: 14px 18px; font-weight: 700; font-size: 16px;
  box-shadow: 0 var(--lift) 0 var(--edge); transition: transform .06s, box-shadow .06s; }
.btn:active:not(:disabled) { transform: translateY(var(--lift)); box-shadow: 0 0 0 var(--edge); }
.btn:disabled { --lift: 0px; }
.btn-main { font-weight: 800; background: var(--accent); color: var(--accent-ink); border-color: var(--accent-edge); --edge: var(--accent-edge); text-transform: uppercase; letter-spacing: .6px; width: 100%; }
.btn-main:disabled { background: var(--line); color: var(--muted); border-color: var(--line); --edge: var(--line); cursor: default; }

/* tabs */
.tabs { display: flex; border-top: 2px solid var(--line); background: var(--bg); padding-block: 6px 8px; gap: 8px; }
.tabs button { flex: 1; border: none; background: none; border-radius: 14px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 700; font-size: 12px; color: var(--muted); }
.tabs button .g { font-family: var(--font-jp); font-size: 22px; font-weight: 800; line-height: 1.1; }
.tabs button[aria-current="page"] { color: var(--accent); background: var(--sel-bg); }

/* ---------- Home ---------- */
.h-top { display: flex; align-items: center; justify-content: space-between; padding-block: 14px 6px; gap: 8px; }
.logo { font-family: var(--font-ui); font-weight: 800; font-size: 26px; color: var(--accent); letter-spacing: .5px; }
.chips { display: flex; gap: 6px; }
.chip { display: flex; align-items: center; gap: 5px; font-weight: 800; font-size: 16px; padding: 6px 10px; border-radius: 12px; font-variant-numeric: tabular-nums; }
.chip svg { width: 22px; height: 22px; }
.chip.fire { color: var(--fire); }
.chip.fire.off { color: var(--muted); }
.chip.fire.off svg { filter: grayscale(1); opacity: .5; }
.chip.xp { color: var(--gold); }
.h-body { display: flex; flex-direction: column; gap: 16px; padding-block: 8px 28px; }
.panel { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 16px; }
.goal { display: flex; gap: 16px; align-items: center; }
.ring { width: 76px; height: 76px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
.goal-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.goal-txt h2 { margin: 0; font-size: 20px; font-weight: 800; text-wrap: balance; }
.goal-txt p { margin: 0; color: var(--muted); font-size: 14px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 14px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); font-weight: 600; }
.wd i { width: 32px; height: 32px; max-width: 100%; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-style: normal; font-family: var(--font-jp); font-size: 14px; box-sizing: border-box; }
.wd.on i { background: var(--fire); border-color: var(--fire); color: #fff; font-weight: 800; }
.wd.today i { outline: 2px solid var(--accent); outline-offset: 2px; }
.now { display: flex; flex-direction: column; gap: 10px; border-color: var(--accent); }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--accent); }
.now h2 { margin: 0; font-size: clamp(24px, 6.8vw, 30px); line-height: 1.15; font-weight: 800; text-wrap: balance; }
.now p { margin: 0 0 4px; color: var(--muted); font-size: 15px; font-weight: 500; }
/* ---------- XP by day chart ---------- */
.xpc { display: flex; flex-direction: column; gap: 6px; }
.xpc-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.xpc-head h2 { margin: 0; font-size: 17px; font-weight: 700; }
.seg { display: flex; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 2px; gap: 2px; }
.seg button { border: none; background: none; border-radius: 9px; padding: 5px 10px; font-size: 13px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.xpc-sum { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.xpc-sum b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.xpc-plot { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: 150px auto; column-gap: 6px; }
.xpc-y { position: relative; font-size: 11px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; min-width: 22px; }
.xpc-y span { position: absolute; right: 0; transform: translateY(-50%); }
.xpc-area { position: relative; border-bottom: 1px solid var(--muted); }
.xpc-grid { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
.xpc-goal { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--muted); opacity: .7; pointer-events: none; }
.xpc-key { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.xpc-key i { width: 18px; border-top: 2px dashed var(--muted); opacity: .7; }
.xpc-bars { position: absolute; inset: 0; display: flex; gap: 2px; }
.xpc-col { flex: 1; min-width: 0; border: none; background: none; padding: 0; display: flex; align-items: flex-end; justify-content: center; position: relative; border-radius: 6px; }
.xpc-col i { display: block; width: 100%; max-width: 26px; background: var(--xp-bar); border-radius: 4px 4px 0 0; transition: height .9s cubic-bezier(.2,.8,.2,1); }
.xpc-col.zero i { background: none; }
.xpc-col:hover, .xpc-col[aria-pressed="true"] { background: var(--sel-bg); }
.xpc-tip { position: absolute; transform: translate(-50%, calc(-100% - 8px)); background: var(--ink); color: var(--card); border-radius: 8px; padding: 4px 8px;
  font-size: 12px; font-weight: 700; white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; z-index: 2; }
.xpc-x { grid-column: 2; display: flex; gap: 2px; padding-top: 4px; }
.xpc-x span { flex: 1; min-width: 0; text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: visible; font-variant-numeric: tabular-nums; }
.xpc-x span.today { color: var(--ink); font-weight: 700; }

/* ---------- Progress motion ---------- */
#ringArc { transition: stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1); }
.bar.grow i { transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
.bump { animation: bump .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes bump { 40% { transform: scale(1.3); } }
.wd.pop i { animation: dot-in .45s cubic-bezier(.3,1.6,.5,1) backwards; animation-delay: var(--d, 0ms); }
@keyframes dot-in { from { transform: scale(.3); opacity: 0; } }
.r-prog .pv { display: flex; align-items: baseline; gap: 8px; }
.r-prog .gain { font-size: 14px; font-weight: 700; color: var(--good); font-variant-numeric: tabular-nums; }
.streak-bg { position: fixed; inset: 0; z-index: 15; background: var(--bg); display: flex; align-items: center; justify-content: center;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); animation: fade .25s ease-out; }
@keyframes fade { from { opacity: 0; } }
.streak { width: 100%; max-width: 480px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
.st-flame { width: 120px; height: 120px; color: var(--fire); animation: pop .6s cubic-bezier(.3,1.6,.5,1), flicker 2.4s ease-in-out .6s infinite; transform-origin: 50% 90%; }
.st-flame svg { width: 100%; height: 100%; }
@keyframes flicker { 50% { transform: scale(1.04, .97) rotate(-1.5deg); } }
.st-num { font-size: 72px; font-weight: 800; line-height: 1; color: var(--fire); font-variant-numeric: tabular-nums; }
.streak h2 { margin: 0; font-size: 26px; font-weight: 800; text-wrap: balance; }
.streak p { margin: 0 0 8px; color: var(--muted); font-weight: 500; max-width: 34ch; }
.streak .week { width: 100%; margin: 4px 0 16px; }
.set { display: flex; flex-direction: column; gap: 10px; }
.set small { color: var(--muted); font-size: 13px; font-weight: 500; }
.auth-fields { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.auth-fields label { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
.auth-fields input { width: 100%; box-sizing: border-box; min-height: 48px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--bg); }
.auth-status { color: var(--muted); font-size: 13px; margin: 0; }
.auth-status:empty { display: none; }
.account-banner.guest { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 14px; }
#profileTitle { overflow-wrap: anywhere; }
.account-banner.guest #accountName { font-size: 13px; line-height: 1.3; }
.auth-open { min-height: 40px; padding: 6px 10px; font-size: 14px; border-radius: 10px; white-space: nowrap; }
.auth-dialog { width: min(480px, calc(100% - 24px)); max-height: calc(100dvh - 32px); box-sizing: border-box; padding: 20px; border: 1px solid var(--line); border-radius: 24px; background: var(--card); color: var(--ink); overflow-y: auto; }
.auth-dialog::backdrop { background: rgba(10,12,30,.45); }
.auth-dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
.auth-dialog-head h2 { margin: 0; font-size: 22px; }
.auth-dialog .auth-status:not(:empty) { margin-top: 14px; }
.set .sync { justify-content: flex-start; text-align: left; }
.set-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.set-chips button { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
.set-chips button small { font-size: 11px; font-weight: 500; color: var(--muted); }
.set-chips button[aria-pressed="true"] { border-color: var(--accent); background: var(--sel-bg); color: var(--accent); }
.settings-toggles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.settings-toggles .set-row { gap: 8px; padding: 10px 12px; font-size: 14px; line-height: 1.25; min-height: 56px; }
.setting-state { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 0 0 30px; }
.setting-value { color: var(--muted); font-size: 10px; font-weight: 800; line-height: 1; }
.setting-icon { width: 26px; height: 26px; flex: 0 0 26px; color: var(--ink); }
.setting-icon svg { display: block; width: 100%; height: 100%; }
.setting-slash { display: none; }
.settings-toggles [aria-pressed="false"] .setting-icon { color: var(--muted); }
.settings-toggles [aria-pressed="false"] .setting-slash { display: block; }
#sync { font-size: 12px; font-weight: 500; margin-top: 6px; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left; }
.set-row b { color: var(--accent); font-weight: 700; }
.set-row b.off { color: var(--muted); }
.btn.danger { color: var(--bad); width: 100%; }
/* author credit: a shimmering link at the very bottom of the profile */
.made { align-self: center; margin-top: 8px; padding: 10px 14px; font-size: 15px; font-weight: 800; text-decoration: none; border-radius: 12px;
  background: linear-gradient(90deg, var(--accent), var(--fire), var(--gold), #e05aa0, var(--accent)) 0 0 / 300% 100%;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--accent);
  animation: shimmer 4s linear infinite; }
.made:hover, .made:focus-visible { animation-duration: 1.6s; }
@keyframes shimmer { to { background-position: 300% 0; } }
.mist { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
.mist .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--bad-bg); color: var(--bad); display: grid; place-items: center; font-family: var(--font-jp); font-weight: 800; font-size: 20px; flex: none; }
.mist span { display: flex; flex-direction: column; min-width: 0; }
.mist small { color: var(--muted); font-weight: 500; font-size: 13px; }
.sec { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); margin: 6px 2px -4px; }
.topics { display: flex; flex-direction: column; gap: 10px; }
.topic { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px 14px; }
.topic .glyph { width: 52px; height: 52px; flex: none; border-radius: 16px; display: grid; place-items: center; font-family: var(--font-jp); font-weight: 800; font-size: 26px; background: var(--sel-bg); color: var(--accent); }
.topic.passed { border-color: var(--gold); --edge: var(--gold); }
.topic.passed .glyph { background: var(--gold); color: #fff; position: relative; }
.topic .check { position: absolute; right: -6px; bottom: -6px; width: 24px; height: 24px; border-radius: 50%; background: var(--good); color: #fff; display: grid; place-items: center; border: 2px solid var(--card); }
.topic .check svg { width: 14px; height: 14px; }
.pill { display: inline-block; align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; padding: 2px 8px; border-radius: 8px; background: var(--good-bg); color: var(--good); }
.topic .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.topic .nm { font-weight: 700; font-size: 17px; display: flex; justify-content: space-between; gap: 8px; }
.topic .nm small { color: var(--muted); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.badge { align-self: flex-start; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 8px; background: var(--sel-bg); color: var(--accent); }
.topic .nm small.hot { color: var(--accent); }
.topic .meta { font-size: 13px; font-weight: 500; color: var(--muted); }
.bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; background: var(--gold); transition: width .4s; }
.bar i.part { background: var(--learn); }
.all { display: flex; flex-direction: column; gap: 10px; }
.all .nm { font-weight: 700; font-size: 17px; display: flex; justify-content: space-between; gap: 8px; }
.all .nm small { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.lg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; font-weight: 600; color: var(--muted); }
.lg span { display: inline-flex; align-items: center; gap: 6px; }
.lg i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.lg i.done { background: var(--gold); }
.lg i.part { background: var(--learn); }
.dots { display: inline-flex; gap: 4px; align-items: center; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--gold); }
.h-foot { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.h-foot .btn { font-size: 14px; padding: 10px 14px; }
.legend { text-align: center; color: var(--muted); font-size: 13px; margin: 0; }
.sync { display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; color: var(--muted); font-size: 13px; font-weight: 600; }
.sync i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.sync.ok i { background: var(--good); }
.sync.warn i { background: var(--gold); }

.cur { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; font-weight: 800; color: var(--muted); }
.cur select { font: inherit; color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 6px 8px; font-weight: 800; max-width: 100%; }

/* ---------- Lesson page and grammar notes ---------- */
.u-top { display: flex; align-items: center; gap: 6px; padding-block: 10px 6px; }
.u-top .ttl { display: flex; flex-direction: column; min-width: 0; }
.u-top h1 { margin: 0; font-size: 22px; font-weight: 800; }
.u-top small { color: var(--muted); font-weight: 600; font-size: 13px; }
.u-body { display: flex; flex-direction: column; gap: 12px; padding-block: 8px 28px; }
.drill .glyph { background: var(--good-bg); color: var(--good); }
.note-btn .glyph { background: var(--line); color: var(--ink); }
.note { display: flex; flex-direction: column; gap: 10px; }
.note h2 { margin: 0; font-size: 19px; font-weight: 800; text-wrap: balance; }
.note p { margin: 0; font-size: 15px; line-height: 1.5; }
.note ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; line-height: 1.45; }
.exs { display: flex; flex-direction: column; gap: 8px; }
.exs div { display: flex; flex-direction: column; gap: 1px; border-left: 3px solid var(--learn); padding-left: 10px; }
.exs b { font-family: var(--font-jp); font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
.exs span { font-size: 14px; color: var(--muted); font-weight: 500; }
.gt-wrap { overflow-x: auto; }
.gt { width: 100%; border-collapse: collapse; font-size: 15px; }
.gt th, .gt td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.gt th { background: var(--sel-bg); font-size: 13px; font-weight: 700; }
.gt td { font-family: var(--font-jp); font-weight: 500; }

/* ---------- Notes as tap-through stories ---------- */
.story { cursor: pointer; -webkit-user-select: none; user-select: none; }
.st-top { display: flex; flex-direction: column; gap: 10px; padding-block: 12px 4px; }
.st-bars { display: flex; gap: 4px; }
.st-bars span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.st-bars i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .25s; }
.st-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.st-head .ttl { display: flex; flex-direction: column; min-width: 0; }
.st-head b { font-size: 15px; font-weight: 700; }
.st-head small { font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.st-stage { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding-block: 8px; }
.st-card { margin-block: auto; display: flex; flex-direction: column; gap: 16px; padding-block: 8px; }
.st-card.fwd { animation: st-in .22s ease-out; }
.st-card.back { animation: st-back .22s ease-out; }
@keyframes st-in { from { opacity: 0; transform: translateX(24px); } }
@keyframes st-back { from { opacity: 0; transform: translateX(-24px); } }
.st-eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--accent); }
.st-card h2 { margin: 0; font-size: clamp(26px, 7.4vw, 34px); line-height: 1.15; font-weight: 800; text-wrap: balance; }
.st-card h2.cont { font-size: 20px; color: var(--muted); }
.st-card p { margin: 0; font-size: 18px; line-height: 1.5; font-weight: 500; }
.st-card ul { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; font-size: 18px; line-height: 1.45; font-weight: 500; }
.st-card .exs { gap: 14px; }
.st-card .exs div { border-left-width: 4px; padding-left: 12px; gap: 2px; }
.st-card .exs b { font-size: 21px; line-height: 1.4; }
.st-card .exs span { font-size: 15px; }
.st-card .gt { font-size: 16px; background: var(--card); }
.st-card .gt th, .st-card .gt td { padding: 8px 10px; }
.st-end { align-items: center; text-align: center; }
.st-end .big { font-family: var(--font-jp); font-size: 64px; font-weight: 800; color: var(--gold); line-height: 1.1; }
.st-end .btn { width: 100%; }
.st-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 6px 12px; color: var(--muted); font-size: 13px; font-weight: 600; text-align: center; }
.st-nav button { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; padding: 0; color: var(--ink); flex: none; }
.st-nav button:disabled { opacity: .35; cursor: default; }
.st-nav svg { width: 22px; height: 22px; }

/* ---------- Dictionary ---------- */
.d-top { display: flex; flex-direction: column; gap: 10px; padding-block: 14px 10px; }
.d-top h1 { margin: 0; font-size: 24px; font-weight: 800; }
.d-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.d-lesson { --lift: 2px; padding: 8px 12px; font-size: 14px; border-radius: 12px; display: flex; align-items: center; gap: 6px; }
.d-lesson svg { width: 14px; height: 14px; }
.pick { display: flex; flex-direction: column; gap: 8px; max-height: 50vh; overflow-y: auto; }
.pick button { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 14px; font-weight: 700; }
.pick button small { color: var(--muted); font-weight: 500; font-size: 13px; }
.pick button[aria-pressed="true"] { border-color: var(--accent); background: var(--sel-bg); color: var(--accent); }
.search { width: 100%; box-sizing: border-box; border: 2px solid var(--line); border-radius: 14px; background: var(--card); padding: 12px 14px; font-weight: 600; font-size: 16px; }
.search::placeholder { color: var(--muted); }
.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex: none; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; color: var(--muted); display: flex; gap: 6px; }
.filters button small { font-size: 12px; font-variant-numeric: tabular-nums; }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.d-list { display: flex; flex-direction: column; gap: 8px; padding-block: 4px 16px; }
.d-group { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin: 10px 2px 0; }
.d-row { border: 2px solid var(--line); border-radius: 14px; background: var(--card); padding: 10px 14px; text-align: left; display: flex; flex-direction: column; gap: 8px; width: 100%; }
.d-row .r1 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.d-row .k { display: flex; flex-direction: column; min-width: 0; }
.d-row .k b { font-family: var(--font-jp); font-size: 19px; font-weight: 700; overflow-wrap: anywhere; }
.d-row .k small { color: var(--muted); font-size: 12px; font-weight: 500; overflow-wrap: anywhere; }
.d-row .ru { font-weight: 600; font-size: 15px; text-align: right; min-width: 0; overflow-wrap: anywhere; }
.d-more { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 2px solid var(--line); padding-top: 8px; font-size: 13px; font-weight: 500; color: var(--muted); }
.d-more .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.d-more .note { color: var(--ink); }
.d-more .say { width: 40px; height: 40px; border-radius: 12px; }
.d-more .say svg { width: 20px; height: 20px; }
.ex { color: var(--bad); font-family: var(--font-jp); font-weight: 800; font-size: 12px; border: 2px solid var(--bad); border-radius: 6px; padding: 0 4px; }
.d-empty { text-align: center; color: var(--muted); font-weight: 600; padding: 32px 8px; }
.d-foot { padding-block: 10px; border-top: 2px solid var(--line); }

/* ---------- Lesson ---------- */
.l-top { display: flex; align-items: center; gap: 12px; padding-block: 14px 6px; }
.icon-btn { border: none; background: none; width: 40px; height: 40px; padding: 0; display: grid; place-items: center; color: var(--muted); border-radius: 12px; flex: none; }
.icon-btn svg { width: 24px; height: 24px; }
.prog { flex: 1; height: 16px; border-radius: 8px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 8px; transition: width .45s cubic-bezier(.3,1.4,.5,1); box-shadow: inset 0 -4px 0 rgba(0,0,0,.1); }
.hearts { display: flex; align-items: center; gap: 4px; color: var(--bad); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.hearts svg { width: 24px; height: 24px; }
.hearts.hit { animation: thump .4s; }
@keyframes thump { 40% { transform: scale(1.35); } }
.l-sub { display: flex; justify-content: space-between; gap: 12px; min-height: 20px; font-size: 14px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.combo { text-align: right; font-weight: 700; color: var(--gold); }
.l-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding-block: 6px 16px; }
.q { display: flex; flex-direction: column; gap: 18px; flex: 1; }
.q-kind { margin: 0; font-size: 17px; font-weight: 700; color: var(--muted); text-wrap: balance; }
.q-kind .again { font-weight: 800; display: block; font-size: 13px; color: var(--bad); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
.prompt { display: flex; align-items: center; gap: 12px; }
.prompt-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.prompt .big { font-family: var(--font-jp); font-weight: 800; font-size: clamp(38px, 11vw, 54px); line-height: 1.15; overflow-wrap: anywhere; }
.prompt .big.sent { font-size: clamp(24px, 6.8vw, 32px); line-height: 1.4; font-weight: 700; }
.tile.w { font-size: 18px; padding: 10px 12px; }
.prompt .ru { font-weight: 800; font-size: clamp(26px, 7.5vw, 34px); line-height: 1.2; text-wrap: balance; }
.prompt .sub { color: var(--muted); font-weight: 600; font-size: 15px; }
.lvl { order: 9; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); padding-top: 4px; }
.say { flex: none; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; padding: 0; background: var(--accent); color: var(--accent-ink); border-color: var(--accent-edge); } --edge: var(--accent-edge);
.say svg { width: 26px; height: 26px; }
/* answers sit at the bottom of the screen, within reach of the thumb */
.q > .opts, .q > .match, .q > .line { margin-top: auto; }
.q > .intro { margin-block: auto; }
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; font-weight: 600; font-size: 17px; min-height: 60px; min-width: 0; }
.opt .n { width: 26px; height: 26px; flex: none; border: 2px solid var(--line); border-radius: 8px; display: grid; place-items: center; font-size: 13px; color: var(--muted); }
.opt .t { min-width: 0; overflow-wrap: anywhere; }
.opt .t.jp { font-size: 22px; font-weight: 700; }
.opt[aria-pressed="true"], .pair[aria-pressed="true"] { background: var(--sel-bg); border-color: var(--accent); --edge: var(--accent); color: var(--accent); }
.opt.ok, .pair.ok { background: var(--good-bg); border-color: var(--good); --edge: var(--good); color: var(--good); }
.opt.bad, .pair.bad { background: var(--bad-bg); border-color: var(--bad); --edge: var(--bad); color: var(--bad); animation: shake .35s; }
.pair.ok { opacity: .5; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match > div { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pair { min-height: 62px; display: grid; place-items: center; text-align: center; font-weight: 600; font-size: 15px; padding: 10px 8px; overflow-wrap: anywhere; }
.pair.jp { font-size: 20px; }
.line { min-height: 64px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-end; padding-bottom: 10px; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile { font-family: var(--font-jp); font-size: 24px; font-weight: 700; padding: 8px 14px; min-width: 50px; }
.tile.ghost { visibility: hidden; }
/* new-word card */
.intro { border: 2px solid var(--accent); border-radius: 24px; background: var(--card); padding: 24px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; position: relative; animation: pop .35s cubic-bezier(.3,1.5,.5,1); }
.intro .kanji { font-family: var(--font-jp); font-size: 26px; font-weight: 700; color: var(--muted); }
.intro .kana { font-family: var(--font-jp); font-size: clamp(40px, 12vw, 58px); font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.intro .romaji { color: var(--muted); font-weight: 600; }
.intro .tr { font-size: 26px; font-weight: 800; text-wrap: balance; padding-top: 8px; }
.intro .note { font-size: 15px; font-weight: 600; color: var(--muted); }
.intro .note.exn { color: var(--bad); }
.intro .say { margin-top: 8px; }
.intro .ex { position: absolute; top: 14px; right: 14px; font-size: 14px; padding: 2px 6px; }
.intro-n { text-align: center; color: var(--muted); font-size: 13px; font-weight: 600; }
.l-foot { border-top: 2px solid var(--line); background: var(--bg); padding-bottom: 14px; transition: background .2s, border-color .2s; }
.l-foot.ok { background: var(--good-bg); border-color: var(--good); }
.l-foot.bad { background: var(--bad-bg); border-color: var(--bad); }
.l-foot-in { display: flex; flex-direction: column; gap: 12px; padding-top: 14px; }
.msg:empty { display: none; }
.msg { display: flex; flex-direction: column; gap: 2px; }
.msg b { font-size: 21px; font-weight: 800; }
.l-foot.ok .msg b { color: var(--good); }
.l-foot.bad .msg b { color: var(--bad); }
.msg span { font-size: 15px; font-weight: 500; }
.msg .jp { font-size: 18px; font-weight: 700; }
.l-foot.ok .btn-main { background: var(--good); border-color: var(--good-edge); --edge: var(--good-edge); color: #fff; }
.l-foot.bad .btn-main { background: var(--bad); border-color: var(--bad-edge); --edge: var(--bad-edge); color: #fff; }

/* ---------- Result ---------- */
.r-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; padding-block: 32px 16px; }
.r-big { font-family: var(--font-jp); font-weight: 800; font-size: clamp(40px, 12vw, 60px); color: var(--gold); line-height: 1.1; }
.r-body h2 { margin: 0; font-size: 24px; font-weight: 800; text-wrap: balance; }
.r-body p { margin: 0; color: var(--muted); max-width: 40ch; }
.r-badge { width: 96px; height: 96px; flex: none; border-radius: 28px; background: var(--gold); color: #fff; display: grid; place-items: center; font-family: var(--font-jp); font-weight: 800; font-size: 48px; position: relative; animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
.r-badge .check { position: absolute; right: -8px; bottom: -8px; width: 36px; height: 36px; border-radius: 50%; background: var(--good); display: grid; place-items: center; border: 3px solid var(--bg); }
.r-badge .check svg { width: 20px; height: 20px; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
.stat { border: 2px solid; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; text-align: center; }
.stat span { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #fff; padding: 4px; }
.stat b { font-size: 24px; font-weight: 800; padding: 10px 4px; background: var(--card); font-variant-numeric: tabular-nums; }
.stat.x { border-color: var(--gold); } .stat.x span { background: var(--gold); } .stat.x b { color: var(--gold); }
.stat.a { border-color: var(--good); } .stat.a span { background: var(--good); } .stat.a b { color: var(--good); }
.stat.f { border-color: var(--fire); } .stat.f span { background: var(--fire); } .stat.f b { color: var(--fire); }
.r-prog { width: 100%; box-sizing: border-box; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.r-prog .nm { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 700; }
.r-prog .nm b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.r-prog small { color: var(--muted); font-weight: 600; font-size: 13px; }
.words { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.word { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: var(--card); border: 2px solid var(--line); }
.word .jp { font-weight: 700; font-size: 18px; min-width: 0; overflow-wrap: anywhere; }
.word.g .jp { font-size: 15px; }
.word .ru { color: var(--muted); font-weight: 500; text-align: right; min-width: 0; }
.word .ch { display: flex; align-items: center; justify-content: flex-end; gap: 4px; width: 56px; font-weight: 700; font-size: 15px; }
.word.bad { border-color: var(--bad); }
.up { color: var(--good); }
.down { color: var(--bad); }
.r-foot { display: flex; flex-direction: column; gap: 10px; padding-block: 12px 14px; }

.sheet-bg { position: fixed; inset: 0; background: rgba(10,12,30,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 12px; text-align: center;
  padding-top: 24px; padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); box-sizing: border-box; }
.sheet h3 { margin: 0; font-size: 20px; font-weight: 800; }
.sheet p { margin: 0 0 6px; color: var(--muted); }
.btn-quit { border: none; background: none; color: var(--bad); font-weight: 800; text-transform: uppercase; letter-spacing: .6px; padding: 12px; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app">
<!-- HOME -->
<section class="screen" id="home">
  <header class="h-top gut">
    <span class="logo">Nihongo jouzu</span>
    <div class="chips">
      <span class="chip fire" id="hStreak" data-t-title="streakChip" role="img">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2c1.5 4 6 6 6 12a6 6 0 0 1-12 0c0-3 1.5-5 3-6.5 0 2.3 1.2 3.5 2.3 3.8C10.6 8 11.3 5 12 2z"/><path fill="#ffd27a" d="M12 12c1 1.8 3 3 3 5.4a3 3 0 0 1-6 0c0-1.8 1-3 2-3.8 0 1 .4 1.8 1 2-.3-1.4-.3-2.6 0-3.6z"/></svg>
        <span id="hStreakN">0</span>
      </span>
      <span class="chip xp" data-t-title="totalXp">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
        <span id="hXp">0</span>
      </span>
    </div>
  </header>
  <div class="scroll">
    <div class="h-body gut">
      <div class="panel now">
        <span class="eyebrow" data-t="today"></span>
        <h2 id="nowTitle"></h2>
        <p id="nowSub"></p>
        <button class="btn btn-main" id="smartBtn" type="button" data-t="start"></button>
      </div>

        <span class="ico">誤</span>
        <span><b data-t="mistTitle"></b><small id="mistN"></small></span>

      <p class="sec" data-t="lessons"></p>
      <div class="topics" id="lessons"></div>
    </div>
  </div>
</section>

<!-- PROFILE -->
<section class="screen" id="profile" hidden>
  <div class="d-top gut"><h1 id="profileTitle"></h1></div>
  <div class="scroll">
    <div class="h-body gut">
      <div class="panel set account-banner" id="accountPanel">

            <b id="ringTxt">0/30</b>
          </div>

            <h2 id="goalTitle"></h2>
            <p id="goalSub"></p>
          </div>
        </div>
        <div class="week" id="week" data-t-aria="last7"></div>
      </div>
      <div class="stats" id="pStats"></div>

          <h2 data-t="xpByDay"></h2>
          <div class="seg" id="xpRange" role="group" data-t-aria="period">
            <button type="button" data-r="7" data-t="d7"></button><button type="button" data-r="14" data-t="d14"></button><button type="button" data-r="30" data-t="d30"></button>
          </div>
        </div>
        <p class="xpc-sum" id="xpSum"></p>
        <div class="xpc-key" aria-hidden="true"><i></i><span data-t="xpKey"></span></div>
        <div class="xpc-plot" id="xpPlot"></div>
      </div>
      <div class="panel all" id="allProg"></div>
      <p class="sec" data-t="settings"></p>
      <div class="panel set">
        <b data-t="language"></b>
        <div class="set-chips" id="langList" role="group" data-t-aria="language">
          <button type="button" data-lang="ru" lang="ru">Русский</button><button type="button" data-lang="en" lang="en">English</button><button type="button" data-lang="ja" lang="ja">日本語</button>
        </div>
        <small data-t="langNote"></small>
      </div>
      <div class="panel set">
        <b data-t="curTitle"></b>
        <div class="set-chips" id="curList" role="group" data-t-aria="curAria"></div>
        <small data-t="curNote"></small>
      </div>
      <div class="settings-toggles">
      <button class="btn set-row" id="kanjiBtn" type="button"><span data-t="kanji"></span><span class="setting-state" aria-hidden="true"><span class="setting-icon" aria-hidden="true"><svg viewBox="0 0 26 26"><text x="13" y="20" text-anchor="middle" font-size="22" class="jp" fill="currentColor">漢</text><g class="setting-slash" fill="none" stroke-linecap="round"><path d="M3 3L23 23" stroke="var(--card)" stroke-width="5"/><path d="M3 3L23 23" stroke="currentColor" stroke-width="2"/></g></svg></span><span class="setting-value" id="kanjiValue"></span></span></button>
      <button class="btn set-row" id="soundBtn" type="button"><span data-t="sound"></span><span class="setting-state" aria-hidden="true"><span class="setting-icon" aria-hidden="true"><svg viewBox="0 0 26 26"><path d="M3 10v6h5l6 5V5l-6 5z" fill="currentColor"/><path d="M18 9a6 6 0 0 1 0 8M21 6a10 10 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><g class="setting-slash" fill="none" stroke-linecap="round"><path d="M3 3L23 23" stroke="var(--card)" stroke-width="5"/><path d="M3 3L23 23" stroke="currentColor" stroke-width="2"/></g></svg></span><span class="setting-value" id="soundValue"></span></span></button>
      </div>
      <div class="panel set">
        <b data-t="backupTitle"></b>
        <small data-t="backupNote"></small>
        <button class="btn" id="exportBtn" type="button" data-t="backupExport"></button>
        <button class="btn" id="importBtn" type="button" data-t="backupImport"></button>
        <input id="backupFile" type="file" accept=".json,application/json" hidden>
        <small id="backupStatus" role="status" aria-live="polite"></small>
      </div>
      <p class="sec" data-t="howTitle"></p>
      <p class="legend" data-t="howText"></p>
      <button class="btn danger" id="resetBtn" type="button" data-t="reset"></button>
      <div class="set" id="accountActions" hidden>
        <button class="btn" id="authLogout" type="button" data-t="authLogout" hidden></button>
        <small id="authStatus" class="auth-status" role="status" aria-live="polite"></small>
      </div>
      <div class="sync" id="sync" role="status"><i aria-hidden="true"></i><span id="syncTxt"></span></div>
      <a class="made" href="https://t.me/amuru" target="_blank" rel="noopener">made by @Amuru</a>
    </div>
  </div>
</section>

<dialog id="authDialog" class="auth-dialog" aria-labelledby="authDialogTitle">
  <div class="auth-dialog-head"><h2 id="authDialogTitle" data-t="authTitle"></h2><button id="authClose" class="icon-btn" type="button" data-t-aria="authClose">×</button></div>
        <form id="authForm">
          <fieldset id="authFields" class="auth-fields">
            <div class="set-chips" role="group" data-t-aria="authTitle">
              <button type="button" data-auth-mode="login" data-t="authLogin" aria-pressed="true"></button>
              <button type="button" data-auth-mode="register" data-t="authRegister" aria-pressed="false"></button>
            </div>
            <label><span data-t="authLoginLabel"></span><input id="authLogin" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" pattern="[A-Za-z0-9_]{3,32}" minlength="3" maxlength="32" aria-describedby="authLoginHint" required></label>
            <small id="authLoginHint" data-t="authLoginHint"></small>
            <label><span data-t="authCodeLabel"></span><input id="authCode" name="password" type="password" autocomplete="current-password" minlength="4" maxlength="128" aria-describedby="authCodeHint" required></label>
            <small id="authCodeHint" data-t="authCodeHint"></small>
            <label id="authConfirmRow" hidden><span data-t="authConfirmLabel"></span><input id="authConfirm" name="confirm" type="password" autocomplete="new-password" minlength="4" maxlength="128"></label>
            <button class="btn btn-main" id="authSubmit" type="submit" data-t="authLogin"></button>
          </fieldset>
        </form>
  <p id="authDialogStatus" class="auth-status" role="status" aria-live="polite"></p>
</dialog>

<!-- ONE LESSON -->
<section class="screen" id="unit" hidden>
  <div class="u-top gut">
    <button class="icon-btn" id="uBack" type="button" data-t-aria="toLessons"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="ttl"><h1 id="uTitle"></h1><small id="uSub"></small></div>
  </div>
  <div class="scroll"><div class="u-body gut" id="uBody"></div></div>
</section>

<!-- GRAMMAR NOTES -->
<section class="screen story" id="note" hidden data-t-aria="notes">
  <div class="st-top gut">
    <div class="st-bars" id="stBars" aria-hidden="true"></div>
    <div class="st-head">
      <div class="ttl"><b id="stLesson"></b><small id="stCount"></small></div>
      <button class="icon-btn" id="nBack" type="button" data-t-aria="closeNotes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
    </div>
  </div>
  <div class="st-stage gut" id="stStage"><article class="st-card" id="stCard" aria-live="polite"></article></div>
  <div class="st-nav gut">
    <button type="button" id="stPrev" data-t-aria="back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span id="stHint"></span>
    <button type="button" id="stNext" data-t-aria="next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</section>

<!-- DICTIONARY -->
<section class="screen" id="dict" hidden>
  <div class="d-top gut">
    <div class="d-head"><h1 data-t="dict"></h1><button class="btn d-lesson" id="dLesson" type="button" aria-haspopup="dialog"></button></div>
    <input class="search" id="dq" type="search" data-t-ph="searchPh" autocomplete="off" data-t-aria="searchAria">
    <div class="filters" id="dFilters" role="group" data-t-aria="filterAria"></div>
  </div>
  <div class="scroll"><div class="d-list gut" id="dList"></div></div>
  <div class="d-foot gut" id="dFoot"><button class="btn btn-main" id="dTrain" type="button"></button></div>
</section>

<!-- LESSON -->
<section class="screen" id="lesson" hidden>
  <div class="l-top gut">
    <button class="icon-btn" id="quitBtn" type="button" data-t-aria="quitAria"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
    <div class="prog" aria-hidden="true"><i id="prog"></i></div>
    <span class="hearts" id="hearts"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg><span id="heartsN">5</span></span>
  </div>
  <div class="l-sub gut"><span id="count"></span><span class="combo" id="combo" aria-live="polite"></span></div>
  <main class="l-body gut"><div class="q" id="q" aria-live="polite"></div></main>
  <footer class="l-foot" id="foot">
    <div class="l-foot-in gut">
      <div class="msg" id="msg"></div>
      <button class="btn btn-main" id="act" type="button"></button>
    </div>
  </footer>
</section>

<!-- RESULT -->
<section class="screen" id="result" hidden>
  <div class="r-body gut" id="rBody"></div>
  <div class="r-foot gut">
    <button class="btn btn-main" id="rAgain" type="button" data-t="again"></button>
    <button class="btn" id="rHome" type="button"></button>
  </div>
</section>

<nav class="tabs gut" id="tabs" data-t-aria="tabs">
  <button type="button" data-tab="home" aria-current="page"><span class="g">家</span><span data-t="tabHome"></span></button>
  <button type="button" data-tab="dict"><span class="g">辞</span><span data-t="tabDict"></span></button>
  <button type="button" data-tab="profile"><span class="g">私</span><span data-t="tabProfile"></span></button>
</nav>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>

<!-- BUILD:SCRIPTS (tools/build.py puts the course data and the app code here) -->
</body>
</html>
